<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4ecdc4" />
  <title>Inventario</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth-guard.js"></script>
  <script src="data.js"></script>
  <style>
  
    /* Coraregir tabla inventario - Centrado limpio con columnas optimizadas (ACTUALIZADO: 2 COLUMNAS) */
    .tabla-header.inventario {
      display: grid !important;
      grid-template-columns: 1fr 80px !important;
    }
    
      .tabla-fila.inventario {
      display: grid !important;
      grid-template-columns: 1fr 80px !important;
    }

/* Centrado específico para columna de stock */
    .col-stock {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-weight: bold !important;
      color: #4ecdc4 !important;
    }

    .col-accion {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* ===== ESTILOS PARA MODAL AÑADIR STOCK ===== */
    #modalAñadirStock {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: flex-start !important;
      padding-top: 2rem !important;
      box-sizing: border-box;
    }

    #modalAñadirStock .modal-content {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 200%;
      max-width: 900px;
      min-height: 300px !important;
      max-height: calc(100vh - 2rem) !important;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #modalAñadirStock .modal-content h4 {
      margin: 0;
      padding: 1.5rem 1.5rem 1rem 1.5rem;
      color: #333;
      text-align: center;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }

    #modalAñadirStock .modal-body {
      padding: 1rem 1.5rem;
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 240px);
    }

    .fecha-stock-selector {
      margin-bottom: 1.5rem;
    }

    .fecha-stock-selector label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #333;
    }

    .fecha-stock-input {
      width: 100%;
      max-width: 200px;
      padding: 0.7rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      background-color: white;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-sizing: border-box;
      margin: 0 auto;
      display: block;
    }

    .fecha-stock-input:focus {
      border-color: #4ecdc4;
      outline: none;
      box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.2);
    }

    .btn-seleccionar-sabores {
      width: 100%;
      padding: 0.8rem;
      font-size: 1rem;
      border: none;
      border-radius: 5px;
      background-color: #4ecdc4;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .btn-seleccionar-sabores:hover {
      background-color: #3da9a1;
    }

    /* ===== ESTILOS PARA FORMULARIO DINÁMICO DE STOCK (FASE 2) ===== */
    .formulario-sabores-stock {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 5px;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }

    .formulario-sabores-stock h5 {
      margin: 0 0 1rem 0;
      color: #333;
      text-align: center;
    }

    /* TABLA INVISIBLE para alineamiento perfecto */
    .tabla-stock {
      width: 100%;
      border-collapse: collapse;
    }

    .tabla-stock td {
      padding: 0.3rem 0.3rem;
      border-bottom: 1px solid #eee;
      vertical-align: middle;
      height: 2.2rem;
    }

    .tabla-stock tr:last-child td {
      border-bottom: none;
    }

    /* Columna del botón X - centrada */
    .col-eliminar-stock {
      width: 40px;
      text-align: center;
      vertical-align: middle !important;
    }

    /* Columna del sabor - alineada a la izquierda */
    .col-sabor-stock {
      text-align: left;
      padding-left: 0.5rem !important;
      vertical-align: middle !important;
    }

    /* Columna del input - centrada */
    .col-cantidad-stock {
      width: 80px;
      text-align: center;
      vertical-align: middle !important;
    }

    /* MODIFICACIONES: Botón X - Más compacto, sin borde rojo, casi del tamaño del emoji */
    .btn-eliminar-sabor-stock {
      background: #f8f9fa !important;
      color: #dc3545 !important;
      border: none !important;
      border-radius: 3px;
      padding: 0.1rem !important;
      cursor: pointer;
      font-size: 0.9rem !important;
      transition: all 0.2s ease;
      width: 24px !important;
      height: 24px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: none !important;
    }

    .btn-eliminar-sabor-stock:hover {
      background: #dc3545 !important;
      color: white !important;
      transform: scale(1.05) !important;
    }

    .sabor-stock-nombre {
      font-weight: 500;
      color: #333;
      line-height: 1.3 !important;
      margin: 0 !important;
      padding: 0 !important;
      display: inline-block !important;
    }

    /* MODIFICACIONES: Input de cantidad - Altura reducida para coincidir con el texto */
    .input-cantidad-stock {
      width: 60px;
      padding: 0.25rem 0.3rem !important;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      text-align: center;
      background-color: white;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-sizing: border-box;
      height: 1.8rem !important;
      line-height: 1.3 !important;
      margin: 0 !important;
      vertical-align: middle !important;
    }

    .input-cantidad-stock:focus {
      border-color: #4ecdc4;
      outline: none;
      box-shadow: 0 0 0 2px rgba(78, 205, 196, 0.2);
    }

    .mensaje-sin-sabores {
      text-align: center;
      color: #666;
      font-style: italic;
      padding: 1rem;
    }

    /* ===== ESTILOS PARA MODAL SELECTOR DE SABORES ===== */
    #modalSelectorSabores {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 1100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #modalSelectorSabores .modal-content {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 500px;
      max-height: 70vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .lista-sabores-selector {
      padding: 1rem;
      max-height: 400px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .sabor-item-selector {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.8rem;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
    }

    .sabor-item-selector:hover {
      background-color: #f8f9fa;
    }

    .sabor-item-selector:last-child {
      border-bottom: none;
    }

    .sabor-checkbox {
      transform: scale(1.2);
      cursor: pointer;
    }

    .sabor-nombre {
      flex-grow: 1;
      font-weight: 500;
      color: #333;
    }

    @media (max-width: 768px) {
      .tabla-header.inventario,
      .tabla-fila.inventario {
        grid-template-columns: 1fr 50px 50px !important;
      }

      /* Responsive para modales */
      #modalAñadirStock {
        padding: 1rem;
        padding-top: 1rem !important;
        padding-bottom: 2rem !important;
      }
      
      #modalAñadirStock .modal-content {
        width: 100%;
        max-height: calc(100vh - 6rem) !important;
        min-height: 250px !important;
      }
      
      #modalAñadirStock .modal-content h4 {
        padding: 1rem;
        font-size: 1.1rem;
      }
      
      #modalAñadirStock .modal-body {
        padding: 0.8rem;
        max-height: calc(100vh - 280px);
      }

      .fecha-stock-input {
        max-width: 100%;
      }
      
      .input-cantidad-stock {
        width: 55px;
        padding: 0.2rem 0.2rem !important;
        font-size: 0.9rem;
        height: 1.6rem !important;
      }

      .btn-eliminar-sabor-stock {
        width: 22px !important;
        height: 22px !important;
        padding: 0.05rem !important;
        font-size: 0.8rem !important;
      }

      .col-eliminar-stock {
        width: 35px;
      }

      .col-cantidad-stock {
        width: 70px;
      }

      .tabla-stock td {
        padding: 0.25rem 0.2rem;
        height: 2rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Inventario</h1>
  </header>

  <main class="container">
    <div class="botones-superiores">
      <button class="btn-volver" onclick="window.location.href='index.html'">← Atrás</button>
      <button class="btn-borrar" onclick="abrirModalHistorial()">📊 Historial</button>
      <button class="btn-borrar" onclick="abrirModalAñadirStock()" style="background-color: #28a745;">📦 Añadir Stock</button>
    </div>

    <div class="lista-sabores">
      <h3>Stock de sabores disponibles:</h3>
      <div class="tabla-sabores">
        <div class="tabla-header inventario" style="display: grid; grid-template-columns: 1fr 60px 60px; background-color: #4ecdc4; color: white; font-weight: bold; padding: 0.8rem 0;">
          <div style="padding: 0 0.8rem; display: flex; align-items: center; cursor: pointer;" onclick="ordenarPorSabor()">Sabor ↕️</div>
          <div style="padding: 0 0.8rem; display: flex; align-items: center; justify-content: center; cursor: pointer;" onclick="ordenarPorStock()">Stock <span id="indicadorOrden">↕️</span></div>
          <div style="padding: 0 0.8rem; display: flex; align-items: center; justify-content: center;"></div>
        </div>
        <div id="tablaInventario" class="tabla-body"></div>
      </div>

      <!-- Botón de borrar inventario después de la tabla -->
      <div style="display: flex; justify-content: center; margin-top: 2rem;">
        <button type="button" onclick="confirmarBorradoInventario()" style="padding: 0.8rem 2rem; font-size: 1rem; border: none; border-radius: 5px; background-color: #dc3545; color: white; cursor: pointer; transition: background-color 0.3s ease;">
          🗑 Borrar inventario completo
        </button>
      </div>
    </div>

    <!-- Modal de confirmación -->
    <div id="modalConfirmacion" class="modal oculto">
      <div class="modal-content">
        <h4>Confirmar operación</h4>
        <div class="modal-body">
          <p id="mensajeConfirmacion"></p>
          <div class="modal-botones">
            <button class="btn-cancelar" onclick="cancelarOperacion()">Cancelar</button>
            <button class="btn-confirmar" onclick="ejecutarOperacion()">Continuar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para añadir stock -->
    <div id="modalAñadirStock" class="modal oculto">
      <div class="modal-content">
        <h4>📦 Añadir Stock</h4>
        <div class="modal-body">
          <!-- Selector de fecha -->
          <div class="fecha-stock-selector">
            <label for="fechaStock">📅 Fecha del movimiento:</label>
            <input type="date" id="fechaStock" class="fecha-stock-input" />
          </div>

          <!-- Botón para seleccionar sabores -->
          <button type="button" class="btn-seleccionar-sabores" onclick="abrirSelectorSabores()">
            🍦 Seleccionar sabores
          </button>

          <!-- Aquí se cargarán los sabores seleccionados (AHORA EN FASE 2) -->
          <div id="saboresSeleccionados">
            <p class="mensaje-sin-sabores">
              No hay sabores seleccionados
            </p>
          </div>

          <!-- Botones del modal -->
          <div class="modal-botones" style="margin-top: 2rem; border-top: 1px solid #eee; padding-top: 1rem;">
            <button class="btn-cancelar" onclick="cerrarModalAñadirStock()">Cancelar</button>
            <button class="btn-confirmar" onclick="procesarStock()">✅ Guardar Stock</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal selector de sabores -->
    <div id="modalSelectorSabores" class="modal oculto">
      <div class="modal-content">
        <h4>🍦 Seleccionar Sabores</h4>
        <div class="lista-sabores-selector" id="listaSaboresSelector">
          <!-- Aquí se cargarán los sabores disponibles -->
        </div>
        <div class="modal-botones" style="padding: 1rem; border-top: 1px solid #eee;">
          <button class="btn-cancelar" onclick="cerrarSelectorSabores()">Cancelar</button>
          <button class="btn-confirmar" onclick="confirmarSaboresSeleccionados()">✅ Continuar</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    let saborActual = null;
    let cantidadPendiente = 0;
    let ordenActual = 'alfabetico';
    let saboresSeleccionadosStock = [];
    const tablaInventario = document.getElementById("tablaInventario");

    async function cargarSabores() {
      const sabores = await getSabores();
      const inventario = await getInventario();
      
      const saboresDisponibles = sabores.filter(sabor => sabor.disponible === true);
      
      tablaInventario.innerHTML = "";
      
      if (saboresDisponibles.length === 0) {
        tablaInventario.innerHTML = '<div class="no-sabores">No hay sabores disponibles para inventario.<br>Marca algunos sabores como "disponibles" en la sección Sabores.</div>';
        return;
      }
      
      let saboresConStock = saboresDisponibles.map(sabor => ({
        ...sabor,
        stock: inventario[sabor.id] ? inventario[sabor.id].stock : 0
      }));
      
      switch(ordenActual) {
        case 'alfabetico':
          saboresConStock.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
          document.getElementById('indicadorOrden').textContent = '↕️';
          break;
        case 'stock-asc':
          saboresConStock.sort((a, b) => a.stock - b.stock);
          document.getElementById('indicadorOrden').textContent = '↑';
          break;
        case 'stock-desc':
          saboresConStock.sort((a, b) => b.stock - a.stock);
          document.getElementById('indicadorOrden').textContent = '↓';
          break;
      }
      
      saboresConStock.forEach(sabor => {
        const fila = document.createElement("div");
        fila.className = "tabla-fila inventario";
        fila.style.display = "grid";
        fila.style.gridTemplateColumns = "1fr 60px 60px";
        fila.style.padding = "0.8rem 0";
        fila.style.borderBottom = "1px solid #eee";
        fila.innerHTML = `
          <div style="padding: 0 0.8rem; display: flex; align-items: center;">${sabor.nombre}</div>
          <div class="col-stock" style="padding: 0 0.8rem;">${sabor.stock}</div>
          <div class="col-accion" style="padding: 0 0.8rem;">
            <button class="btn-editar" onclick="abrirModalCorreccion('${sabor.id}', '${sabor.nombre}', ${sabor.stock})">🔧</button>
          </div>
        `;
        tablaInventario.appendChild(fila);
      });
    }

    function ordenarPorSabor() {
      ordenActual = 'alfabetico';
      cargarSabores();
    }

    function ordenarPorStock() {
      if (ordenActual === 'alfabetico' || ordenActual === 'stock-desc') {
        ordenActual = 'stock-asc';
      } else if (ordenActual === 'stock-asc') {
        ordenActual = 'stock-desc';
      }
      cargarSabores();
    }

    // ===== FUNCIÓN PARA ABRIR MODAL EXTERNO DE CORRECCIÓN =====
    function abrirModalCorreccion(saborId, saborNombre, stockActual) {
      const url = `editarStock.html?id=${encodeURIComponent(saborId)}&nombre=${encodeURIComponent(saborNombre)}&stock=${stockActual}`;
     
      document.body.style.overflow = 'hidden';
      
      // Crear modal overlay
      const modalOverlay = document.createElement('div');
      modalOverlay.id = 'modalExternoOverlay';
      modalOverlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        max-height: calc(100vh - 2rem);
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 1rem !important;
        box-sizing: border-box;
      `;

      // Crear iframe
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.style.cssText = `
        width: 100%;
        max-width: 350px;
        height: calc(100vh - 2rem);
        border: none;
        background: transparent;
        box-shadow: none;
        margin: 0;
        padding: 0;
      `;

      modalOverlay.appendChild(iframe);
      document.body.appendChild(modalOverlay);
      
      // ===== LISTENER ÚNICO PARA MENSAJES DEL IFRAME =====
      const messageHandler = function(e) {
        // Manejar scroll del teclado
        if (e.data && e.data.action === 'scroll' && e.data.direction === 'down') {
          // Mover iframe hacia arriba
          const iframe = modalOverlay.querySelector('iframe');
          if (iframe) {
            iframe.style.transform = 'translateY(-180px)';
            iframe.style.transition = 'transform 0.3s ease';
          }
        }
        
        if (e.data && e.data.action === 'scroll' && e.data.direction === 'up') {
          // Restaurar posición original
          const iframe = modalOverlay.querySelector('iframe');
          if (iframe) {
            iframe.style.transform = 'translateY(0px)';
            iframe.style.transition = 'transform 0.3s ease';
          }
        }

        // Cerrar modal
        if (e.data === 'cerrarModal') {
          document.body.style.overflow = '';
          if (document.body.contains(modalOverlay)) {
            document.body.removeChild(modalOverlay);
          }
          // Remover el listener después de usarlo
          window.removeEventListener('message', messageHandler);
          window.removeEventListener('resize', resizeHandler);
          cargarSabores();
        }
      };

      // ===== LISTENER PARA RESIZE (TECLADO VIRTUAL) =====
      const resizeHandler = function() {
        if (window.innerHeight < 500) { // Si la ventana se hace pequeña (teclado abierto)
          setTimeout(() => {
            window.scrollTo({
              top: 400,
              behavior: 'smooth'
            });
          }, 100);
        }
      };

      // Agregar listeners
      window.addEventListener('message', messageHandler);
      window.addEventListener('resize', resizeHandler);
      
      // ===== LISTENER PARA CERRAR AL HACER CLIC FUERA =====
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) {
          document.body.style.overflow = '';
          if (document.body.contains(modalOverlay)) {
            document.body.removeChild(modalOverlay);
          }
          // Remover listeners
          window.removeEventListener('message', messageHandler);
          window.removeEventListener('resize', resizeHandler);
          cargarSabores();
        }
      });
    }

    // ===== FUNCIÓN PARA ABRIR MODAL EXTERNO DE HISTORIAL =====
    function abrirModalHistorial() {
      const url = `movimientos.html`;
     
      document.body.style.overflow = 'hidden';
      
      // Crear modal overlay
      const modalOverlay = document.createElement('div');
      modalOverlay.id = 'modalHistorialOverlay';
      modalOverlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 2rem !important;
        box-sizing: border-box;
      `;

      // Crear iframe
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.style.cssText = `
        width: 100%;
        max-width: 380px;
        height: calc(100vh - 2rem);
        border: none;
        background: transparent;
        box-shadow: none;
        margin: 0;
        padding: 0;
      `;

      modalOverlay.appendChild(iframe);
      document.body.appendChild(modalOverlay);
      
      // ===== LISTENER ÚNICO PARA MENSAJES DEL IFRAME =====
      const messageHandler = function(e) {
        // Cerrar modal
        if (e.data === 'cerrarModal') {
          document.body.style.overflow = '';
          if (document.body.contains(modalOverlay)) {
            document.body.removeChild(modalOverlay);
          }
          // Remover el listener después de usarlo
          window.removeEventListener('message', messageHandler);
        }
      };

      // Agregar listeners
      window.addEventListener('message', messageHandler);
      
      // ===== LISTENER PARA CERRAR AL HACER CLIC FUERA =====
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) {
          document.body.style.overflow = '';
          if (document.body.contains(modalOverlay)) {
            document.body.removeChild(modalOverlay);
          }
          // Remover listeners
          window.removeEventListener('message', messageHandler);
        }
      });
    }

    function cancelarOperacion() {
      document.getElementById("modalConfirmacion").classList.add("oculto");
    }

    // ===== FUNCIONES PARA AÑADIR STOCK MASIVO =====
    function abrirModalAñadirStock() {
      const fechaInput = document.getElementById("fechaStock");
      const fechaHoy = obtenerFechaLocal();
      fechaInput.value = fechaHoy;
      fechaInput.max = fechaHoy;
      
      saboresSeleccionadosStock = [];
      actualizarVistaSaboresSeleccionados();
      
      document.getElementById("modalAñadirStock").classList.remove("oculto");
    }

    function cerrarModalAñadirStock() {
      document.getElementById("modalAñadirStock").classList.add("oculto");
      saboresSeleccionadosStock = [];
    }

    async function abrirSelectorSabores() {
      const sabores = await getSabores();
      const saboresDisponibles = sabores.filter(sabor => 
        sabor.disponible && 
        !saboresSeleccionadosStock.some(seleccionado => seleccionado.id === sabor.id)
      );
      
      const listaSaboresSelector = document.getElementById("listaSaboresSelector");
      
      if (saboresDisponibles.length === 0) {
        listaSaboresSelector.innerHTML = `
          <p style="text-align: center; color: #666; padding: 2rem; font-style: italic;">
            ${saboresSeleccionadosStock.length > 0 ? 
              'Todos los sabores disponibles ya han sido seleccionados' : 
              'No hay sabores disponibles para agregar stock'
            }
          </p>
        `;
      } else {
        saboresDisponibles.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
        
        listaSaboresSelector.innerHTML = saboresDisponibles.map(sabor => `
          <div class="sabor-item-selector">
            <input type="checkbox" class="sabor-checkbox" id="sabor_${sabor.id}" data-sabor-id="${sabor.id}" />
            <label for="sabor_${sabor.id}" class="sabor-nombre">${sabor.nombre}</label>
          </div>
        `).join('');
      }
      
      document.getElementById("modalSelectorSabores").classList.remove("oculto");
    }

    function cerrarSelectorSabores() {
      document.getElementById("modalSelectorSabores").classList.add("oculto");
    }

    async function confirmarSaboresSeleccionados() {
      const checkboxes = document.querySelectorAll('.sabor-checkbox:checked');
      const sabores = await getSabores();
      
      checkboxes.forEach(checkbox => {
        const saborId = checkbox.dataset.saborId;
        const sabor = sabores.find(s => s.id === saborId);
        
        if (sabor && !saboresSeleccionadosStock.some(s => s.id === saborId)) {
          saboresSeleccionadosStock.push({
            id: sabor.id,
            nombre: sabor.nombre,
            cantidad: 0
          });
        }
      });
      
      cerrarSelectorSabores();
      actualizarVistaSaboresSeleccionados();
    }

    function actualizarVistaSaboresSeleccionados() {
      const contenedor = document.getElementById("saboresSeleccionados");
      
      if (saboresSeleccionadosStock.length === 0) {
        contenedor.innerHTML = `
          <p class="mensaje-sin-sabores">
            No hay sabores seleccionados
          </p>
        `;
        return;
      }
      
      saboresSeleccionadosStock.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
      
      contenedor.innerHTML = `
        <div class="formulario-sabores-stock">
          <h5>📝 Cantidades a agregar:</h5>
          <table class="tabla-stock">
            ${saboresSeleccionadosStock.map(sabor => `
              <tr>
                <td class="col-eliminar-stock">
                  <button onclick="eliminarSaborSeleccionado('${sabor.id}')" 
                          class="btn-eliminar-sabor-stock"
                          onmouseover="this.style.background='#dc3545'; this.style.color='white';" 
                          onmouseout="this.style.background='#f8f9fa'; this.style.color='#dc3545';">❌</button>
                </td>
                <td class="col-sabor-stock">
                  <div class="sabor-stock-nombre">${sabor.nombre}</div>
                </td>
                <td class="col-cantidad-stock">
                  <input type="number" 
                         class="input-cantidad-stock" 
                         id="cantidad_${sabor.id}" 
                         min="1" 
                         max="999"
                         value="${sabor.cantidad || ''}" 
                         placeholder="0"
                         inputmode="numeric"
                         onfocus="manejarFocoInputStock(this)"
                         onblur="manejarBlurInputStock(this, '${sabor.id}')"
                         onchange="actualizarCantidadSabor('${sabor.id}', this.value)" />
                </td>
              </tr>
            `).join('')}
          </table>
        </div>
      `;
    }

    function eliminarSaborSeleccionado(saborId) {
      saboresSeleccionadosStock = saboresSeleccionadosStock.filter(sabor => sabor.id !== saborId);
      actualizarVistaSaboresSeleccionados();
    }

    function manejarFocoInputStock(input) {
      setTimeout(() => {
        input.select();
      }, 50);
      
      setTimeout(() => {
        const rect = input.getBoundingClientRect();
        const inputTop = rect.top + window.pageYOffset;
        const offset = 120;
        const scrollTo = inputTop - offset;
        
        window.scrollTo({
          top: Math.max(0, scrollTo),
          behavior: 'smooth'
        });
      }, 300);
    }

    function manejarBlurInputStock(input, saborId) {
      let valor = parseInt(input.value) || 0;
      if (valor < 0) {
        valor = 0;
        input.value = '';
      }
      
      actualizarCantidadSabor(saborId, valor);
    }

    function actualizarCantidadSabor(saborId, cantidad) {
      const sabor = saboresSeleccionadosStock.find(s => s.id === saborId);
      if (sabor) {
        sabor.cantidad = parseInt(cantidad) || 0;
      }
    }

    function obtenerHoraStock() {
      const fechaInput = document.getElementById("fechaStock");
      const fechaHoy = obtenerFechaLocal();
      const fechaSeleccionada = fechaInput.value;
      
      if (fechaSeleccionada === fechaHoy) {
        return obtenerHoraLocal();
      } else {
        return "23:00";
      }
    }

    function procesarStock() {
      return ejecutarUnaVez(_procesarStockInterno, {
        botones: '.btn-confirmar[onclick="procesarStock()"]'
      });
    }

    async function _procesarStockInterno() {
      if (saboresSeleccionadosStock.length === 0) {
        alert("Selecciona al menos un sabor para continuar");
        return;
      }
      
      const fecha = document.getElementById("fechaStock").value;
      if (!fecha) {
        alert("Selecciona una fecha válida");
        return;
      }

      const fechaHoy = obtenerFechaLocal();
      if (fecha > fechaHoy) {
        alert("No se pueden agregar movimientos a fechas futuras");
        return;
      }

      const stockValido = saboresSeleccionadosStock.filter(sabor => {
        const cantidad = parseInt(sabor.cantidad) || 0;
        return cantidad > 0;
      });

      if (stockValido.length === 0) {
        alert("Ingresa al menos una cantidad válida (mayor a 0)");
        return;
      }

      const fechaFormateada = fecha.split('-').reverse().join('/');
      const horaStock = obtenerHoraStock();
      const esRetroactiva = fecha !== fechaHoy;
      
      let mensaje = `Confirmar entrada de stock:\n\n`;
      mensaje += `📅 Fecha: ${fechaFormateada}\n`;
      mensaje += `🕐 Hora: ${horaStock}`;
      if (esRetroactiva) {
        mensaje += ` (retroactiva)`;
      }
      mensaje += `\n\n📦 Stock a agregar:\n`;
      
      stockValido.forEach(sabor => {
        mensaje += `• ${sabor.nombre}: +${sabor.cantidad}\n`;
      });

      const totalUnidades = stockValido.reduce((sum, sabor) => sum + sabor.cantidad, 0);
      mensaje += `\n🔢 Total: ${totalUnidades} unidades\n\n¿Confirmar operación?`;

      if (confirm(mensaje)) {
        await ejecutarStockMasivo(fecha, horaStock, stockValido);
      }
    }

    async function ejecutarStockMasivo(fecha, hora, stockValido) {
      try {
        const items = stockValido.map(s => ({ id: s.id, cantidad: s.cantidad }));
        const resultados = await agregarStock(items, fecha, hora);

        saboresSeleccionadosStock = [];
        cerrarModalAñadirStock();
        cargarSabores();

        let mensajeExito = `✅ Stock actualizado correctamente!\n\n`;
        mensajeExito += `📅 ${fecha.split('-').reverse().join('/')} a las ${hora}\n\n`;
        mensajeExito += `📋 Resumen:\n`;
        resultados.forEach(resultado => {
          mensajeExito += `• ${resultado.nombre}: ${resultado.stockAnterior} → ${resultado.stockNuevo} (+${resultado.cantidad})\n`;
        });

        const totalProcesado = resultados.reduce((sum, r) => sum + r.cantidad, 0);
        mensajeExito += `\n🔢 Total procesado: ${totalProcesado} unidades`;

        alert(mensajeExito);

      } catch (error) {
        console.error("Error al procesar stock masivo:", error);
        alert("❌ Error al procesar el stock. Inténtalo de nuevo.");
        return false;
      }
    }

    async function confirmarBorradoInventario() {
      const confirmacion = confirm(
        "⚠️ ATENCIÓN ⚠️\n\nEsto borrará TODO el inventario (stock y historial).\nLos SABORES se mantendrán intactos.\n\n¿Estás seguro de continuar?"
      );
      if (confirmacion) {
        await borrarInventario();
        alert("Inventario borrado correctamente.\nLos sabores se mantienen intactos.");
        cargarSabores();
      }
    }

    // Funciones de zona horaria (importadas de script.js)
    // obtenerFechaLocal() y obtenerHoraLocal() ahora viven en data.js

    document.addEventListener("click", function(e) {
      if (e.target.classList.contains("modal")) {
        // Solo cerrar modales que no sean de confirmación crítica
        if (e.target.id !== "modalConfirmacion") {
          cerrarModalAñadirStock();
          cerrarSelectorSabores();
        }
      }
    });

    window.addEventListener("DOMContentLoaded", cargarSabores);
  </script>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function (error) {
          console.error("No se pudo registrar el service worker:", error);
        });
      });
    }
  </script>
</body>
</html>
